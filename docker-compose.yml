version: '3.8'

services: 
  web-app:
    build: .
    container_name: strange-stats
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    restart: always
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: adminxd
      POSTGRES_PASSWORD: pompa
      POSTGRES_DB: strange_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
